[package]
name = "lumen"
version = "0.4.0"
description = "A console-style game launcher for Windows"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# Reading the battery of Sony controllers (DualSense, DualShock 4) directly over HID.
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
