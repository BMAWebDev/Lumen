<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="booting" data-view="home" data-zone="row">
  <div id="bg" aria-hidden="true">
    <div class="bg-layer"><img alt=""></div>
    <div class="bg-layer"><img alt=""></div>
    <div class="bg-shade"></div>
  </div>

  <header id="topbar">
    <nav class="tabs">
      <button id="tab-home" class="tab active" data-i18n="tab.games">Games</button>
      <button id="tab-library" class="tab" data-i18n="tab.library">Library</button>
      <button id="tab-platforms" class="tab" data-i18n="tab.platforms">Platforms</button>
    </nav>
    <div class="status">
      <div id="running-pill" class="running-pill" hidden><i></i><span></span></div>
      <button id="btn-settings" class="icon-btn" aria-label="Settings" data-i18n-aria="aria.settings"></button>
      <div id="avatar" class="avatar" aria-hidden="true"></div>
      <div id="pad-batteries" class="pad-batteries"></div>
      <div id="battery" class="battery" hidden><span class="batt-icon"></span><span class="batt-pct"></span></div>
      <time id="clock"></time>
    </div>
  </header>

  <main>
    <section id="home" class="view">
      <div id="row" class="row">
        <div id="row-track" class="row-track"></div>
        <div id="row-label" class="row-label"></div>
      </div>
      <div id="detail" class="detail"></div>
    </section>

    <section id="library" class="view hidden">
      <div class="lib-head">
        <h2 data-i18n="lib.title">Your library</h2>
        <div id="filters" class="filters"></div>
        <span id="lib-count" class="lib-count"></span>
      </div>
      <div id="grid-wrap" class="grid-wrap">
        <div id="grid" class="grid"></div>
      </div>
    </section>

    <section id="platforms" class="view hidden">
      <div class="lib-head">
        <h2 data-i18n="plat.title">Your platforms</h2>
        <span id="plat-count" class="lib-count"></span>
      </div>
      <div class="grid-wrap">
        <div id="plat-grid" class="grid"></div>
      </div>
    </section>

    <section id="settings" class="view hidden">
      <div class="set-wrap">
        <nav id="set-cats" class="set-cats"></nav>
        <div class="set-main">
          <header><h2 id="set-title"></h2><p id="set-note"></p></header>
          <ul id="set-list" class="set-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <div id="scrim" class="scrim"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <footer id="hints" class="hints"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
